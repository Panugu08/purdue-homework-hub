<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purdue Homework Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="inline-row">
            <h1 id ="title">Purdue Homework Hub</h1>
            <button id = "add">[+ Add]</button>
        </div>
    </div>
    <div class="classes">
        <h2 id = "assignments">My Assignments</h2>
        <div id = "inline-row-h3">
            <button class = "filter">[Filter ▼]</button>
            <button class = "due">[Due Date ▼]</button>
        </div>
        <div class = "courses">
            <h4 class = "course-name">CS 180</h4>
            <p class = "text">Homework 5</p>
            <div id = "inline-row-p">
                <p class = "text">Due: September 31st</p>
                <div class = "open-done">
                    <button class = "right-text">[Open]</button>
                    <button class = "right-text">[✓ Done]</button>
                </div>
            </div>
        </div>
        <div class = "courses">
            <h4 class = "course-name">MA 261</h4>
            <p class = "text">Lesson 13</p>
            <div id = "inline-row-p">
                <p class = "text">Due: September 30th</p>
                <div class = "open-done">
                    <button class = "right-text">[Open]</button>
                    <button class = "right-text">[✓ Done]</button>
                </div>
            </div>
        </div>
        <div class = "courses">
            <h4 class = "course-name">EAPS</h4>
            <p class = "text">Chapter 15 Connect Assignment</p>
            <div id = "inline-row-p">
                <p class = "text">Due: September 28th</p>
                <div class = "open-done">
                    <button class = "right-text">[Open]</button>
                    <button class = "right-text">[✓ Done]</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
